apply plugin: 'com.android.application'

// --- Version -----------------------------------------------------------------
// versionName tracks package.json so the web app and the APK never disagree.
// CI passes -PversionCode=<run number> so each build supersedes the last; a local
// build falls back to 1, which is fine for sideloading over yourself.
def packageJson = new groovy.json.JsonSlurper().parseText(rootProject.file('../package.json').text)
def appVersionName = project.findProperty('versionName') ?: packageJson.version
def appVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()

// --- Release signing ---------------------------------------------------------
// Credentials come from android/keystore.properties (local, gitignored) or from
// ANDROID_KEYSTORE_* env vars (CI). When none are present the release signing
// config is simply not declared, so a fresh clone still builds debug fine.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def keystorePath = keystoreProperties['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = keystoreProperties['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keystoreAlias = keystoreProperties['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
def keystoreAliasPassword = keystoreProperties['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')

def resolvedKeystore = null
if (keystorePath) {
    def candidate = new File(keystorePath)
    resolvedKeystore = candidate.isAbsolute() ? candidate : rootProject.file(keystorePath)
}
def canSignRelease = resolvedKeystore?.exists() && keystorePassword && keystoreAlias && keystoreAliasPassword

android {
    namespace = "com.hakansilsupur.tasks"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hakansilsupur.tasks"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Pinned to a keystore committed in the repo. Without this, Gradle signs
        // debug builds with an auto-generated ~/.android/debug.keystore, which a
        // fresh CI runner creates from scratch with a random key every run — so
        // every build would carry a different certificate and Android would
        // refuse to install one over another.
        debug {
            storeFile rootProject.file('app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        if (canSignRelease) {
            release {
                storeFile resolvedKeystore
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreAliasPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            if (canSignRelease) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle('No keystore configured — release APK will be unsigned. See docs/ANDROID.md')
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
