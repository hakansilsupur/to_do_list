name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm run build` typechecks first, so a type error fails the APK build too.
      - name: Install and build web assets
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Copies dist/ into the native project and regenerates the plugin wiring.
      # capacitor-cordova-android-plugins is gitignored, so this must run before Gradle.
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        # run_number as versionCode keeps every CI build installable over the last.
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}

      - name: Name the debug APK
        id: debug
        run: |
          version=$(node -p "require('./package.json').version")
          name="tasks-${version}-build${{ github.run_number }}-debug.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: tasks-debug-apk
          path: ${{ steps.debug.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      # --- Release track: only on a v* tag, and only once signing secrets exist ---

      - name: Check for signing secrets
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — publishing the debug APK only. See docs/ANDROID.md to enable signed releases."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: release.jks
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${GITHUB_REF_NAME#v}
          rm -f release.jks

      - name: Name the release APK
        id: release
        if: steps.signing.outputs.available == 'true'
        run: |
          name="tasks-${GITHUB_REF_NAME}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.release.outputs.path }}
            ${{ steps.debug.outputs.path }}
          fail_on_unmatched_files: false
          generate_release_notes: true
